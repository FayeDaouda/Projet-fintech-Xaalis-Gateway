[project]
name = "xaalis-gateway"
version = "0.1.0"
description = "Xaalis Gateway — passerelle de paiement mobile money multi-opérateurs (projet pédagogique)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "alembic>=1.14",
    "argon2-cffi>=23.1",
    "asyncpg>=0.30",
    "cryptography>=43",
    "fastapi>=0.115",
    "grpcio>=1.85.4",
    "grpcio-health-checking>=1.85.4",
    "httpx>=0.27",
    "opentelemetry-api>=1.45.2",
    "opentelemetry-exporter-otlp-proto-grpc>=1.45.2",
    "opentelemetry-instrumentation-fastapi>=0.66b2",
    "opentelemetry-instrumentation-grpc>=0.66b2",
    "opentelemetry-instrumentation-httpx>=0.66b2",
    "opentelemetry-instrumentation-redis>=0.66b2",
    "opentelemetry-instrumentation-sqlalchemy>=0.66b2",
    "opentelemetry-sdk>=1.45.2",
    "polars>=1.12",
    "prometheus-client>=0.21",
    "protobuf>=7.36.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyjwt>=2.10",
    "python-ulid>=3.0",
    "redis>=5.2",
    "sqlalchemy[asyncio]>=2.0.36",
    "strawberry-graphql[fastapi]>=0.250",
    "structlog>=24.4",
    "tzdata>=2024.2",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1",
    "asyncpg-stubs>=0.32.0",
    "grpcio-tools>=1.85.4",
    "httpx>=0.27",
    "hypothesis>=6.120",
    "locust>=2.32",
    "mypy>=1.13",
    "mypy-protobuf>=5.1.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "pytest-timeout>=2.3",
    "ruff>=0.8",
    "schemathesis>=4",
    "testcontainers[postgres,redis]>=4.8",
    "types-grpcio>=1.85.0.20261122",
    "types-grpcio-health-checking>=1.85.0.20261126",
    "types-protobuf>=7.35.1.20261122",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# `xaalis` : la passerelle (api + worker), seul paquet mesuré par la couverture.
# `xaalis_risk` : microservice gRPC de scoring (règles métier, mesuré par la couverture).
# `xaalis_sim` : simulateurs hors périmètre métier (opérateurs, marchand de démo).
packages = ["src/xaalis", "src/xaalis_risk", "src/xaalis_sim"]

[tool.uv]
default-groups = ["dev"]

# --------------------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# Code gRPC généré depuis proto/ (scripts/generate_grpc.py, vérifié en CI) : jamais retouché.
extend-exclude = ["src/xaalis/risk/v1/*_pb2*"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # bugbear
    "BLE",      # except Exception non justifié
    "A",        # builtins shadowing
    "C4",       # comprehensions
    "DTZ",      # datetimes naïfs interdits (XG-15 : tout en UTC)
    "S",        # bandit
    "SIM",      # simplifications
    "RUF",      # règles ruff
    "ASYNC",    # pièges asyncio
    "PT",       # style pytest
    "T20",      # pas de print()
]

# Signes typographiques volontaires dans la documentation en français.
allowed-confusables = ["×", "−", "’", "–"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311"]
"migrations/**" = ["N999"]

[tool.ruff.format]
quote-style = "double"

# --------------------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy", "strawberry.ext.mypy_plugin"]
mypy_path = "src"
packages = ["xaalis", "xaalis_risk", "xaalis_sim"]

[[tool.mypy.overrides]]
module = ["testcontainers.*"]
ignore_missing_imports = true

# Exception limitée au schéma GraphQL : les décorateurs et enums de Strawberry ne sont pas
# typés de façon exploitable par mypy (décorateurs « untyped », enums opaques). Le reste du
# paquet reste en --strict complet.
[[tool.mypy.overrides]]
module = ["xaalis.reporting.schema"]
disallow_untyped_decorators = false
warn_unreachable = false

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# --------------------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
# Filet de sécurité : un test bloqué échoue au bout de 120 s en affichant la pile de tous
# les threads, au lieu de figer la CI.
timeout = 120
timeout_method = "thread"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["xaalis", "xaalis_risk"]
branch = true
# SQLAlchemy async exécute le code ORM dans des greenlets : sans cela, coverage les ignore.
concurrency = ["greenlet", "thread"]
omit = [
    "src/xaalis/worker/__main__.py",
    "src/xaalis_risk/__main__.py",
    "src/xaalis/risk/v1/*_pb2*.py",  # code généré depuis proto/
]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]
