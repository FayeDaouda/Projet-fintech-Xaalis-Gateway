# Lancement complet : `docker compose up --build`
# Aucun fichier .env n'est requis : les valeurs par défaut ci-dessous sont des valeurs
# de DÉVELOPPEMENT (préfixe dev-only-), refusées par l'application en production.

name: xaalis

x-app: &app
  image: xaalis-gateway:local
  build:
    context: .
    target: runtime
  restart: unless-stopped
  environment: &app-env
    XAALIS_ENVIRONMENT: ${XAALIS_ENVIRONMENT:-development}
    XAALIS_DATABASE_URL: postgresql+asyncpg://xaalis:${POSTGRES_PASSWORD:-xaalis}@db:5432/xaalis
    XAALIS_REDIS_URL: redis://redis:6379/0
    XAALIS_API_KEY_PEPPER: ${XAALIS_API_KEY_PEPPER:-dev-only-api-key-pepper-not-for-production}
    XAALIS_JWT_SECRET: ${XAALIS_JWT_SECRET:-dev-only-jwt-secret-not-for-production-use}
    XAALIS_LOG_LEVEL: ${XAALIS_LOG_LEVEL:-INFO}
    XAALIS_RATE_LIMIT_ENABLED: ${XAALIS_RATE_LIMIT_ENABLED:-true}
    XAALIS_OPERATORS_BASE_URL: http://operators:8100
    XAALIS_PUBLIC_BASE_URL: http://api:8000
    XAALIS_MERCHANT_DEMO_URL: http://merchant-demo:8200/webhooks
    XAALIS_RISK_SERVICE_TARGET: risk:50051
    # Traces OpenTelemetry → Jaeger (bonus, ADR 0014). Mettre à false pour les désactiver.
    XAALIS_OTEL_ENABLED: ${XAALIS_OTEL_ENABLED:-true}
    XAALIS_OTEL_EXPORTER_ENDPOINT: http://jaeger:4317
    XAALIS_OTEL_SAMPLE_PERMILLE: ${XAALIS_OTEL_SAMPLE_PERMILLE:-1000}
    XAALIS_WEBHOOK_ENCRYPTION_KEY: ${XAALIS_WEBHOOK_ENCRYPTION_KEY:-dev-only-webhook-encryption-key-01}
    XAALIS_DEMO_WEBHOOK_SECRET: ${XAALIS_DEMO_WEBHOOK_SECRET:-dev-only-demo-webhook-secret-00001}
    # Relances webhooks : 7 délais (s) entre 8 tentatives. Pour la démo : '[2,2,2,2,2,2,2]'.
    XAALIS_WEBHOOK_RETRY_SCHEDULE_SECONDS: ${XAALIS_WEBHOOK_RETRY_SCHEDULE_SECONDS:-[60,300,1800,7200,14400,25200,36000]}
    XAALIS_OPERATOR_SECRET_GOPAY: ${XAALIS_OPERATOR_SECRET_GOPAY:-dev-only-gopay-callback-secret-0001}
    XAALIS_OPERATOR_SECRET_TERANGA: ${XAALIS_OPERATOR_SECRET_TERANGA:-dev-only-teranga-callback-secret-0001}
    XAALIS_OPERATOR_SECRET_NDIAGA: ${XAALIS_OPERATOR_SECRET_NDIAGA:-dev-only-ndiaga-callback-secret-0001}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: xaalis
      POSTGRES_USER: xaalis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-xaalis}
    command: ["postgres", "-c", "max_connections=200", "-c", "shared_buffers=256MB"]
    ports: ["5432:5432"]
    volumes: [db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xaalis -d xaalis"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Service à usage unique : migrations puis jeu de démonstration (idempotent), puis arrêt.
  # api et worker attendent sa réussite (service_completed_successfully).
  migrate:
    <<: *app
    restart: "no"
    command: ["sh", "-c", "alembic upgrade head && python -m xaalis.seed"]
    environment:
      <<: *app-env
      XAALIS_SEED_ADMIN_PASSWORD: ${XAALIS_SEED_ADMIN_PASSWORD:-dev-only-admin-password}
      XAALIS_DEMO_TEST_PUBLISHABLE_KEY: ${XAALIS_DEMO_TEST_PUBLISHABLE_KEY:-}
      XAALIS_DEMO_TEST_SECRET_KEY: ${XAALIS_DEMO_TEST_SECRET_KEY:-}
    healthcheck: { disable: true }
    depends_on:
      db: { condition: service_healthy }

  api:
    <<: *app
    environment:
      <<: *app-env
      XAALIS_SERVICE_NAME: xaalis-api
      # Un processus Python n'utilise qu'un cœur (GIL) : plusieurs processus uvicorn.
      # Voir docs/load-test.md. Budget de connexions : 4 × (10 + 10) + écoute SSE ≤ 100.
      WEB_CONCURRENCY: ${XAALIS_API_WORKERS:-4}
      XAALIS_DB_POOL_SIZE: ${XAALIS_API_DB_POOL_SIZE:-10}
      XAALIS_DB_MAX_OVERFLOW: ${XAALIS_API_DB_MAX_OVERFLOW:-10}
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus
    tmpfs:
      - /tmp/prometheus:uid=10001,gid=10001
    ports: ["8000:8000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      operators: { condition: service_healthy }
      jaeger: { condition: service_started }  # destination des traces

  worker:
    <<: *app
    command: ["python", "-m", "xaalis.worker"]
    environment:
      <<: *app-env
      XAALIS_SERVICE_NAME: xaalis-worker
      XAALIS_HEALTHCHECK_FILE: /tmp/xaalis-worker.heartbeat
      XAALIS_WORKER_METRICS_PORT: 9100  # lu par Prometheus (réseau interne uniquement)
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      operators: { condition: service_healthy }
      jaeger: { condition: service_started }  # destination des traces

  # Scoring de risque en gRPC (bonus, ADR 0013). Interne : aucun port publié, seul le
  # worker l'appelle. Le worker n'en dépend pas au démarrage : panne = politique de repli.
  risk:
    <<: *app
    command: ["python", "-m", "xaalis_risk"]
    environment:
      <<: *app-env
      XAALIS_HEALTHCHECK_GRPC: 127.0.0.1:50051
      # Numéros signalés pour fraude ; « 77 000 00 00 » sert la démonstration.
      XAALIS_RISK_BLOCKLIST: ${XAALIS_RISK_BLOCKLIST:-["+221770000000"]}
      # Latence injectée (ms) pour montrer la deadline de 150 ms et le repli.
      XAALIS_RISK_LATENCY_MS: ${XAALIS_RISK_LATENCY_MS:-0}

  operators:
    <<: *app
    command: ["uvicorn", "xaalis_sim.operators.app:app", "--host", "0.0.0.0", "--port", "8100", "--no-access-log"]
    environment:
      <<: *app-env
      XAALIS_HEALTHCHECK_URL: http://127.0.0.1:8100/healthz
      # Fenêtres de panne périodiques de Ndiaga Cash (0 = désactivées ; /_chaos pour la démo).
      XAALIS_SIM_NDIAGA_OUTAGE_EVERY_SECONDS: ${XAALIS_SIM_NDIAGA_OUTAGE_EVERY_SECONDS:-0}
      XAALIS_SIM_NDIAGA_OUTAGE_DURATION_SECONDS: ${XAALIS_SIM_NDIAGA_OUTAGE_DURATION_SECONDS:-0}
    ports: ["8100:8100"]

  merchant-demo:
    <<: *app
    command: ["uvicorn", "xaalis_sim.merchant_demo.app:app", "--host", "0.0.0.0", "--port", "8200", "--no-access-log"]
    environment:
      <<: *app-env
      XAALIS_HEALTHCHECK_URL: http://127.0.0.1:8200/healthz
    ports: ["8200:8200"]

  # ------------------------------------------------------------------ observabilité (bonus)
  # Traces OTLP (gRPC 4317, interne) ; interface : http://localhost:16686
  jaeger:
    image: jaegertracing/all-in-one:1.65.0
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports: ["16686:16686"]

  prometheus:
    image: prom/prometheus:v3.1.0
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=2d"]
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Tableau de bord provisionné : http://localhost:3000 (lecture anonyme)
  grafana:
    image: grafana/grafana:11.4.0
    restart: unless-stopped
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-dev-only-grafana-admin-password}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/xaalis.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on:
      prometheus: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  db-data:
